# --- DataModule ---
data:
  class_path: DataModule
  init_args:
    dim: 10
    batch_size: 64
    num_workers: 4

# --- Model ---
model:
  class_path: Module
  init_args:
    power: 2

# --- Seed ---
seed_everything: 42

# --- Task ---
log_name: power-${model.init_args.power}-lr-${optimizer.init_args.lr}-seed-${seed_everything}

# --- Trainer ---
trainer:
  max_epochs: 2
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_weights_only: true
        save_top_k: 3
        monitor: val_loss
  logger:
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: ${sci_cli.lightning_logs_dir:}
        name: ${log_name}
  
    # # --- Enables TensorBoard logging ---
    # - class_path: lightning.pytorch.loggers.TensorBoardLogger
    #   init_args:
    #     save_dir: ${sci_cli.lightning_logs_dir:}
    #     name: tb-${log_name}
  

# --- Optimizer ---
optimizer:
  class_path: Adam
  init_args:
    lr: 0.01
